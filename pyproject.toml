[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-grasping"
version = "0.1.0"
description = "Semantic point-guided task-oriented grasp selection and bounded execution demo."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
